# CDSS Pilot. Запуск: cp .env.example .env && (заполнить секреты) && docker compose up -d
# Вход для пользователей — сервис ui (nginx + React, порт UI_PORT, по умолчанию 80); он же проксирует /api.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cdss}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Init-контейнер: alembic upgrade head, затем идемпотентный seed (super_admin из env)
  migrate:
    build: ./backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cdss}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cdss}
      APP_DATABASE_URL: postgresql+psycopg://cdss_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cdss}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      HMAC_KEY: ${HMAC_KEY:?set HMAC_KEY in .env}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SEED_DEMO_ORG: ${SEED_DEMO_ORG:-0}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    environment: *app_env
    ports:
      # Прямой доступ к API (метрики, отладка) — только с локальной машины. Наружу — через ui.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  ui:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${UI_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
