server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности. CSP: только свои скрипты; inline-стили нужны Tailwind/Radix.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 2m;

    # API и служебные страницы бэкенда. /metrics наружу НЕ проксируется.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location ~ ^/(health|docs|redoc|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    # Swagger UI тянет скрипты с CDN, поэтому для /docs и /redoc CSP бэкенда не навязываем
    location = /metrics { return 404; }

    # Хешированные файлы сборки кешируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: любой неизвестный путь отдаёт index.html (маршрутизация на клиенте)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    }
}
